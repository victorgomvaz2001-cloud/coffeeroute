name: coffeeroute

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: coffeeroute
      POSTGRES_PASSWORD: coffeeroute
      POSTGRES_DB: coffeeroute
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coffeeroute -d coffeeroute']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
