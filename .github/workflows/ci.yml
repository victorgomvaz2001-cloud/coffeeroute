name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: coffeeroute
          POSTGRES_PASSWORD: coffeeroute
          POSTGRES_DB: coffeeroute
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coffeeroute -d coffeeroute"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15

    env:
      DATABASE_URL: postgresql://coffeeroute:coffeeroute@localhost:5432/coffeeroute
      REDIS_URL: redis://localhost:6379
      # API e2e tests run against their own database and Redis DB.
      E2E_DATABASE_URL: postgresql://coffeeroute:coffeeroute@localhost:5432/coffeeroute_test
      E2E_REDIS_URL: redis://localhost:6379/1
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

      - name: Expo dependency check
        working-directory: apps/mobile
        run: npx expo-doctor
